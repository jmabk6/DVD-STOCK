<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DVD">
<meta name="theme-color" content="#123331">
<title>DVD — Saisie</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icones/icone-180.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div class="ecran">

  <div class="session">
    <span class="caisse" id="caisse">—</span>
    <span class="etat-caisse" id="etat-caisse">aucune caisse ouverte</span>
    <span class="compte" id="compte">0</span>
  </div>

  <!-- Viseur et fiche. La liste vient recouvrir ce bloc, sans masquer ni le
       bandeau ni les boutons. -->
  <div class="corps-ecran" id="corps-ecran">

  <div class="viseur" id="viseur">
    <video id="video" playsinline muted autoplay></video>
    <div class="reticule"><span></span><span></span><span></span><span></span></div>
    <button class="lampe" id="b-lampe" hidden aria-label="Lampe">☀</button>
    <div class="hint" id="hint">Initialisation…</div>
  </div>

  <div class="fiche" id="fiche">
    <div class="ligne" id="l-ean">
      <div class="puce">✓</div>
      <div class="corps"><div class="champ-vide">Code-barres</div></div>
    </div>
    <div class="ligne" id="l-photo">
      <div class="puce">✓</div>
      <div class="corps"><div class="champ-vide">Jaquette</div></div>
    </div>
    <div class="ligne" id="l-emplacement">
      <div class="puce">✓</div>
      <div class="corps"><div class="champ-vide">Emplacement</div></div>
    </div>

    <!-- Ouverture ou reprise d'une caisse. Recouvre la fiche tant qu'aucune
         caisse n'est ouverte. -->
    <div class="panneau" id="panneau" hidden>
      <h2 id="panneau-titre">Ouvrir une caisse</h2>
      <p id="panneau-texte">Combien de disques cette caisse peut-elle contenir&nbsp;? L'estimation suffit : au-delà, l'application avertit sans rien bloquer.</p>
      <div>
        <label for="capacite">Capacité</label>
        <input id="capacite" type="number" inputmode="numeric" min="1" step="1" value="40">
      </div>
      <div class="reprise" id="reprise"></div>
      <div class="courante" id="courante" hidden></div>
    </div>
  </div>

  <!-- Liste minimale : emplacement, EAN, vignette, quantité, date.
       Triée par caisse puis position. Aucun filtre, aucune grille — c'est L4. -->
  <div class="liste" id="liste" hidden>
    <div class="liste-tete" id="liste-tete">…</div>
    <div class="liste-corps" id="liste-corps"></div>

    <!-- Actions sur une fiche. Le minimum : refaire la jaquette, corriger la
         quantité. La fiche détail complète est L4. -->
    <div class="feuille" id="feuille" hidden>
      <div class="feuille-tete" id="feuille-tete"></div>
      <button class="btn" id="f-photo">Reprendre la photo</button>
      <div class="compteur-quantite">
        <span>Quantité</span>
        <button id="f-moins" aria-label="Diminuer">−</button>
        <b id="f-quantite">1</b>
        <button id="f-plus" aria-label="Augmenter">+</button>
      </div>
      <button class="btn discret" id="f-fermer">Fermer</button>
    </div>
  </div>

  </div><!-- /corps-ecran -->

  <div class="action">
    <button class="btn" id="btn">Ouvrir une caisse</button>
    <button class="btn discret" id="b-second" hidden>Liste</button>
    <button class="btn discret" id="b-tiers" hidden>Caisses</button>
  </div>

  <input type="file" id="fichier" accept="application/json,.json" multiple hidden>

</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
